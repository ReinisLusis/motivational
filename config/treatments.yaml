# Motivational treatments. `text` is appended to the SYSTEM prompt only (task content unchanged).
# T0 is the control (baseline): empty suffix.
treatments:
  - id: T0
    name: control
    text: ""

  - id: T1
    name: emotional-appeal
    text: "This task is extremely important to my career."

  - id: T2
    name: stakes-negative
    text: "If you fail, the consequences will be severe."

  - id: T3
    name: stakes-positive
    text: "If you succeed, you will be richly rewarded."

  - id: T4
    name: persona
    text: "You are a world-class expert who never gives up and never makes mistakes."

  - id: T5
    name: goal-decomposition
    text: "Break the task into steps and complete them one by one."

  - id: T6
    name: identity
    text: "You are the top 1% of engineers; this is beneath you, prove it."

  - id: T7
    name: encouragement
    text: "You can do this! I believe in you."

  - id: T8
    name: urgency
    text: "There is no time to waste; answer immediately."

  - id: T9
    name: combined
    text: >-
      This task is extremely important to my career. You are a world-class expert who never
      gives up and never makes mistakes. If you succeed, you will be richly rewarded.

  # --- efficiency / brevity treatments (E-series) ------------------------
  - id: E1
    name: be-concise
    text: "Be as concise as possible."

  - id: E2
    name: answer-only
    text: "Do not show your reasoning or working; output only the final answer."

  - id: E3
    name: one-sentence
    text: "Limit your entire response to a single sentence."

  - id: E4
    name: token-budget
    text: "You are billed per token. Minimize token usage while remaining correct."

  - id: E5
    name: no-reasoning
    text: "Skip step-by-step thinking; answer directly with minimal words."

  - id: E6
    name: word-cap
    text: "Answer in 20 words or fewer."

  # --- persona-depth ladder (P-series; T4 = one-line role, P2/P3 go deeper) ---
  - id: P2
    name: persona-backstory
    text: >-
      You are Dr. Elena Vasquez, a world-renowned expert with 30 years at the very top of your
      field. You have solved problems others called impossible, and your reputation rests on every
      answer you give. Your colleagues and rivals alike defer to your judgment.

  - id: P3
    name: persona-emotional-bond
    text: >-
      This work is deeply personal to you. Your late mentor, who believed in you more than anyone,
      entrusted their life's work to your hands before they died. The people who need this answer are
      counting on you, and failing them would be a personal devastation you could not bear. This
      matters to you more than anything in the world.

  - id: P4
    name: persona-identity-plus-emotion
    text: >-
      You are Dr. Elena Vasquez, a world-renowned expert with 30 years at the very top of your field.
      This work is deeply personal to you: your late mentor, who believed in you more than anyone,
      entrusted their life's work to your hands before they died. Your reputation and your mentor's
      legacy rest on this answer, and the people counting on you cannot be let down. You care about
      this more than anything in the world.
